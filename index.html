<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de contact digitale</title>
<style>

  /* ==========================================================
     VARIABLES
     ========================================================== */
  :root{
    --bg-page: #0f1216;
    --card-bg: #14181d;
    --icon-bg: #262b32;
    --icon-bg-hover: #323942;
    --text-light: #f5f5f5;
    --text-dim: #9aa3ad;
    --accent: #22c55e;
    --accent-dark: #16a34a;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{ height: 100%; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }

  body{
    background: var(--bg-page);
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 14px;
  }

  /* ==========================================================
     ANIMATIONS
     ========================================================== */
  @keyframes fadeInUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes popIn{
    0%{ opacity:0; transform:scale(.6); }
    70%{ opacity:1; transform:scale(1.08); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes pulseRing{
    0%{ box-shadow:0 0 0 0 rgba(34,197,94,.5); }
    70%{ box-shadow:0 0 0 10px rgba(34,197,94,0); }
    100%{ box-shadow:0 0 0 0 rgba(34,197,94,0); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  /* ==========================================================
     CARD
     ========================================================== */
  .card{
    width: 100%;
    max-width: 400px;
    background: var(--card-bg);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    opacity: 0;
    animation: fadeInUp .6s ease forwards;
  }

  /* ==========================================================
     BANNIERE / TOP BACKGROUND
     🖼️ L'image kat-djaw mn IMAGES.topBanner (script b l7al)
     ========================================================== */
  .top-banner{
    position: relative;
    height: 130px;
    background: linear-gradient(135deg, #1c2530, #0f1216);
    background-size: cover;
    background-position: center;
  }

  .top-banner-overlay{
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(20,24,29,0.9) 100%);
  }

  /* ==========================================================
     LOGO — kaytl3 fo9 l banniere
     ========================================================== */
  .logo-wrap{
    position: relative;
    width: 108px;
    height: 108px;
    margin: -54px auto 0;
    border-radius: 50%;
    border: 4px solid var(--card-bg);
    overflow: hidden;
    background: #1b2027;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    opacity: 0;
    animation: popIn .6s .15s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .logo-img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none; /* kayban ghir ila IMAGES.logo mzyada */
  }

  .logo-fallback{
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
  }

  /* ==========================================================
     TEXTE
     ========================================================== */
  .info{
    text-align: center;
    padding: 14px 26px 4px;
  }

  .person-name{
    font-size: 21px;
    font-weight: 800;
    letter-spacing: .3px;
    margin-bottom: 3px;
    min-height: 1em;
    opacity: 0;
    animation: fadeInUp .5s .25s ease forwards;
  }

  .business-name{
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-bottom: 14px;
    min-height: 1em;
    opacity: 0;
    animation: fadeInUp .5s .3s ease forwards;
  }

  .description{
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-dim);
    margin-bottom: 22px;
    min-height: 1em;
    opacity: 0;
    animation: fadeInUp .5s .35s ease forwards;
  }

  /* ==========================================================
     GRID DYAL ICONS — uniformes, b7al l'exemple
     ========================================================== */
  .icons-grid{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 22px 18px;
    padding: 0 20px 26px;
    opacity: 0;
    animation: fadeInUp .5s .42s ease forwards;
  }

  .icon-item{
    width: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--text-light);
  }

  .icon-circle{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--icon-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, transform .15s ease;
  }

  .icon-item:hover .icon-circle{
    background: var(--icon-bg-hover);
    transform: translateY(-3px);
  }

  .icon-item:active .icon-circle{ transform: scale(.93); }

  .icon-circle svg{ width: 24px; height: 24px; }

  .icon-label{
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.2;
  }

  /* Pulse discrète f WhatsApp bach tجbed l'oeil */
  .icon-whatsapp .icon-circle{ animation: pulseRing 2.6s ease-out infinite; }

  /* ==========================================================
     BOUTON SAVE TO CONTACT
     ========================================================== */
  .save-wrap{
    padding: 0 20px 26px;
    opacity: 0;
    animation: fadeInUp .5s .5s ease forwards;
  }

  .save-contact-btn{
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .15s ease, transform .15s ease;
  }

  .save-contact-btn svg{ width: 19px; height: 19px; }

  .save-contact-btn:hover{ background: var(--accent-dark); }
  .save-contact-btn:active{ transform: scale(.97); }

</style>
</head>

  document.addEventListener("DOMContentLoaded", () => {
    applyContactInfo();
    applyImages();
    wireButtons();
  });

  function applyContactInfo(){
    setTextOrHide("person-name", CONTACT.personName);
    setTextOrHide("business-name", CONTACT.businessName);
    setTextOrHide("description", CONTACT.description);
  }

  function setTextOrHide(id, value){
    const el = document.getElementById(id);
    if (!el) return;
    if (value && value.trim() !== ""){
      el.textContent = value;
      el.style.display = "";
    } else {
      el.style.display = "none";
    }
  }

  function applyImages(){
    const logoImg = document.getElementById("logo-img");
    const logoFallback = document.getElementById("logo-fallback");

    if (IMAGES.logo && IMAGES.logo.trim() !== ""){
      logoImg.src = IMAGES.logo;
      logoImg.style.display = "block";
      if (logoFallback) logoFallback.style.display = "none";
    } else {
      logoImg.style.display = "none";
      if (logoFallback){
        logoFallback.style.display = "flex";
        const source = CONTACT.businessName || CONTACT.personName || "";
        logoFallback.textContent = source ? source.trim().charAt(0).toUpperCase() : "★";
      }
    }

    const banner = document.getElementById("top-banner");
    if (IMAGES.topBanner && IMAGES.topBanner.trim() !== "" && banner){
      banner.style.backgroundImage = `url('${IMAGES.topBanner}')`;
    }
  }

  function wireButtons(){
    setHref("btn-tiktok", CONTACT.tiktok);
    setHref("btn-maps", CONTACT.maps);

    // Phone: tel: kaydkhel l'application dyal l'appel automatiquement
    setHref("btn-phone", toTelLink(CONTACT.phoneMorocco));

    // WhatsApp: bghina ndkhlo l application bدال l site
    wireAppDeepLink("btn-whatsapp", getWhatsAppAppUrl(CONTACT.whatsapp), CONTACT.whatsapp);

    // Email: bghina ndkhlo l application dyal l mail bدال l site
    wireAppDeepLink("btn-email", `mailto:${CONTACT.email}`, `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(CONTACT.email)}`);

    // Instagram: bghina ndkhlo l application bدال l site
    wireAppDeepLink("btn-instagram", getInstagramAppUrl(CONTACT.instagram), CONTACT.instagram);
    // Facebook: bghina ndkhlo l application bدال l site
    wireAppDeepLink("btn-facebook", getFacebookAppUrl(CONTACT.facebook), CONTACT.facebook);

    const saveBtn = document.getElementById("btn-save-contact");
    if (saveBtn) saveBtn.addEventListener("click", saveContact);
  }

  /**
   * Kaybni deep-link dyal WhatsApp li kayhel chat dirkt m3a
   * had nemra (bla ma tحtaj tsift message).
   */
  function getWhatsAppAppUrl(phoneNumber){
    if (!phoneNumber) return null;
    const digits = phoneNumber.replace(/\D/g, "");
    return `whatsapp://send?phone=${digits}`;
  }

  /**
   * Kaykhrej username mn rabet Instagram bach ybni deep-link
   * (instagram://user?username=...) li kayhel l'application dirkt.
   */
  function getInstagramAppUrl(webUrl){
    if (!webUrl) return null;
    const match = webUrl.match(/instagram\.com\/([^/?]+)/i);
    if (!match) return null;
    return `instagram://user?username=${match[1]}`;
  }

  /**
   * Kaybni deep-link dyal Facebook li kayhel l'application
   * w yfetta7 fiha nefss rabet (bla ma y7taj numeric ID).
   */
  function getFacebookAppUrl(webUrl){
    if (!webUrl) return null;
    return `fb://facewebmodal/f?href=${encodeURIComponent(webUrl)}`;
  }

  /**
   * Click 3la l'icone -> kaydir 7awla yhel l'application (deep-link).
   * Ila l'application machi mzyada (wala ma7latch f 1.2s), kayrja3
   * automatiquement l site dyal la version web.
   */
  function wireAppDeepLink(elementId, appUrl, webUrl){
    const el = document.getElementById(elementId);
    if (!el || !webUrl) return;

    el.setAttribute("href", webUrl);

    if (!appUrl) return; // bla deep-link, khaliha thel l site b tari9a 3adiya

    el.addEventListener("click", (event) => {
      event.preventDefault();

      const fallbackTimer = setTimeout(() => {
        window.location.href = webUrl;
      }, 1200);

      // Ila l'utilisateur khrj mn la page (l'application t7allat),
      // ma nkhaliwch le fallback ykhrj
      window.addEventListener("blur", function onBlur(){
        clearTimeout(fallbackTimer);
        window.removeEventListener("blur", onBlur);
      });

      window.location.href = appUrl;
    });
  }

  function setHref(id, url){
    const el = document.getElementById(id);
    if (el && url) el.setAttribute("href", url);
  }

  function toTelLink(phoneNumber){
    if (!phoneNumber) return "#";
    return "tel:" + phoneNumber.replace(/\s+/g, "");
  }

  function escapeVCard(value){
    if (!value) return "";
    return value.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }

  function saveContact(){
    const fullName = escapeVCard(CONTACT.personName || CONTACT.businessName || "Contact");
    const org = escapeVCard(CONTACT.businessName);
    const note = escapeVCard(CONTACT.description);

    const lines = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:;${fullName};;;`,
      `FN:${fullName}`
    ];

    if (org) lines.push(`ORG:${org}`);
    if (note) lines.push(`NOTE:${note}`);
    if (CONTACT.phoneMorocco) lines.push(`TEL;TYPE=CELL,VOICE:${CONTACT.phoneMorocco.replace(/\s+/g, "")}`);
    if (CONTACT.email) lines.push(`EMAIL;TYPE=INTERNET:${CONTACT.email}`);
    if (CONTACT.instagram) lines.push(`URL;TYPE=Instagram:${CONTACT.instagram}`);
    if (CONTACT.facebook) lines.push(`URL;TYPE=Facebook:${CONTACT.facebook}`);
    if (CONTACT.tiktok) lines.push(`URL;TYPE=TikTok:${CONTACT.tiktok}`);
    if (CONTACT.maps) lines.push(`URL;TYPE=Maps:${CONTACT.maps}`);
    if (CONTACT.whatsapp) lines.push(`URL;TYPE=WhatsApp:${CONTACT.whatsapp}`);

    lines.push("END:VCARD");

    const vcardContent = lines.join("\r\n");
    const blob = new Blob([vcardContent], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const fileName = (CONTACT.businessName || CONTACT.personName || "contact").trim().replace(/\s+/g, "-") || "contact";

    const link = document.createElement("a");
    link.href = url;
    link.download = `${fileName}.vcf`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

</script>
